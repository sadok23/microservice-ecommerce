parent=keycloak
import=common/keycloak

# Keep the parent (keycloak) theme's login.css as a base, then layer custom.css on top.
# In Keycloak, `styles=` REPLACES the parent's styles (only `stylesCommon` merges),
# so the parent's login.css must be listed explicitly or the base login layout is lost.
styles=css/login.css css/custom.css
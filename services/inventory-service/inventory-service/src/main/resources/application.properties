server.port=8083

spring.application.name=inventory-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:rootpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:http://localhost:8080/realms/ecommerce}

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

# Producer: we send Java objects, JSON-serialized by the JsonSerializer.
# "add.type.headers=false" stops Spring from stamping a __TypeId__ header with the
# FULL producer class name (e.g. com.ecommerce.order_service.event.OrderCreatedEvent).
# We disable it because consumers each define their own copy of the event class and
# don't share packages - the header would point at a class that doesn't exist there.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer: we receive JSON and map it to OUR OWN copy of the event class.
# "use.type.headers=false" + "value.default.type" tells the JsonDeserializer exactly
# which local class to deserialize into, since there is no type header to trust.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.inventory_service.event.OrderCreatedEvent

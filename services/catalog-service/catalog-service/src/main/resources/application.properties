server.port=8081

spring.application.name=catalog-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalog_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:rootpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:http://localhost:8080/realms/ecommerce}

# --- Kafka (consumer only: catalog does not publish, it just syncs its inStock cache) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=catalog-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.catalog_service.event.StockUpdatedEvent